name: Attribution trailer guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  check-trailers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify all commits have Co-authored-by trailer
        run: |
          BASE_SHA="${{ github.event.pull_request.base.sha || github.event.before }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha || github.sha }}"

          if [ -z "$BASE_SHA" ] || [ "$BASE_SHA" = "0000000000000000000000000000000000000000" ]; then
            BASE_SHA=$(git rev-list --max-parents=0 HEAD | tail -1)
          fi

          MISSING=0
          for SHA in $(git rev-list "$BASE_SHA".."$HEAD_SHA"); do
            MSG=$(git log -1 --pretty=%B "$SHA")

            # Skip merge / revert commits
            if echo "$MSG" | head -1 | grep -qE "^(Merge|Revert) "; then
              continue
            fi

            TRAILERS=$(echo "$MSG" | git interpret-trailers --parse)

            # Trust email as identity (matches commit-msg-guard pattern)
            if ! echo "$TRAILERS" | grep -qE "^Co-authored-by: .*<(cursoragent@cursor\.com|noreply@anthropic\.com)>$"; then
              echo "::error::Commit $SHA missing 'Co-authored-by: Cursor' or 'Co-authored-by: Claude' trailer"
              echo "Subject: $(git log -1 --pretty=%s "$SHA")"
              MISSING=1
            fi
          done

          if [ $MISSING -eq 1 ]; then
            exit 1
          fi
